services:
  backend:
    build: ./brainleaf-backend
    env_file:
      - ./brainleaf-backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/brainleaf
    volumes:
      - ./brainleaf-backend/uploads:/app/uploads
    depends_on:
      - mongo
    restart: unless-stopped

  frontend:
    build: ./brainleaf-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
